[project]
name = "hound-agent"
version = "0.1.0"
description = "A tiny agent-oriented SystemOne runner built on Foxhound"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11",
  "PyYAML>=6",
  "requests>=2.32",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.2"]
dev = ["pytest>=8"]

[project.scripts]
hound = "hound.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hound"]

[tool.pytest.ini_options]
testpaths = ["tests"]

